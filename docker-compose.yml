# Desarrollo local — topología split con hot reload: postgres, redis,
# gateway / worker / backend (mismo binario, `pnpm --filter @adobos/backend dev`,
# `ADOBO_ROLE` distinto) y frontend (Astro dev, proxy same-origin a `backend`).
#
# Uso: docker compose up --build
# El navegador entra por http://localhost:4321. Astro hace proxy same-origin
# de /api, /auth y /uploads al servicio `backend` (cookies HttpOnly).
#
# Los tres procesos backend montan el mismo repo (hot reload de `tsx watch`);
# cada uno solo reinicia cuando su propio watcher detecta un cambio, aunque
# los tres vean los mismos archivos.
#
# CUIDADO: los tres llaman `initDatabase()` al boot (aplica migraciones), igual
# que el servicio `migrate`. Es redundante pero idempotente vía el journal de
# Drizzle; si dos procesos migran a la vez durante un hot reload simultáneo
# puede haber reinicios/reintentos. La separación completa connect/migrate es
# Fase 6 del plan — no se resuelve acá.
#
# Producción: docker compose -f docker-compose.prod.yml up -d --build

x-dev-volumes: &dev-volumes
  - .:/app
  - ./data:/data
  - adobos_node_modules:/app/node_modules
  - adobos_backend_modules:/app/backend/node_modules
  - adobos_frontend_modules:/app/frontend/node_modules
  - adobos_shared_modules:/app/packages/shared/node_modules
  - adobos_pnpm_store:/app/.pnpm-store

x-backend-dev-env: &backend-dev-env
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3000
  SERVE_STATIC: "false"
  DATABASE_URL: postgresql://adobos:adobos@postgres:5432/adobos
  REDIS_URL: redis://redis:6379
  DATA_DIR: /data
  PUBLIC_APP_URL: http://localhost:4321
  CORS_ORIGIN: http://localhost:4321
  NODE_OPTIONS: --dns-result-order=ipv4first

x-healthcheck: &health
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adobos
      POSTGRES_PASSWORD: adobos
      POSTGRES_DB: adobos
    ports:
      - "5432:5432"
    volumes:
      - adobos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adobos -d adobos"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - adobos

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - adobos

  install:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: adobos-dev:local
    working_dir: /app
    command: sh -c "pnpm install --frozen-lockfile && if [ ! -e backend/node_modules/pino ] || [ ! -e backend/node_modules/stripe ]; then echo '[adobos] node_modules incompleto, reinstalando…' && pnpm install --force; fi && pnpm --filter @adobos/shared build"
    volumes: *dev-volumes
    networks:
      - adobos
    restart: "no"

  # One-shot: aplica migraciones Drizzle y sale. `gateway`/`worker`/`backend`
  # esperan a que termine antes de arrancar (ver nota de redundancia arriba).
  migrate:
    image: adobos-dev:local
    working_dir: /app
    command: pnpm --filter @adobos/backend db:migrate
    env_file:
      - .env
    environment: *backend-dev-env
    volumes: *dev-volumes
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - adobos
    restart: "no"

  # Discord gateway (dev): único con Client vivo.
  gateway:
    image: adobos-dev:local
    working_dir: /app
    command: pnpm --filter @adobos/backend dev
    env_file:
      - .env
    environment:
      <<: *backend-dev-env
      ADOBO_ROLE: gateway
    volumes: *dev-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    networks:
      - adobos
    restart: unless-stopped

  # Worker (dev): crons + cola. Sin Client — REST.
  worker:
    image: adobos-dev:local
    working_dir: /app
    command: pnpm --filter @adobos/backend dev
    env_file:
      - .env
    environment:
      <<: *backend-dev-env
      ADOBO_ROLE: worker
    volumes: *dev-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    networks:
      - adobos
    restart: unless-stopped

  # Panel + API (dev). Único que publica puerto al host.
  backend:
    image: adobos-dev:local
    working_dir: /app
    command: pnpm --filter @adobos/backend dev
    env_file:
      - .env
    environment:
      <<: *backend-dev-env
      ADOBO_ROLE: api
    ports:
      - "3000:3000"
    volumes: *dev-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    networks:
      - adobos
    restart: unless-stopped

  frontend:
    image: adobos-dev:local
    working_dir: /app
    command: pnpm --filter @adobos/frontend dev
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4321:4321"
    volumes: *dev-volumes
    depends_on:
      install:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - adobos
    restart: unless-stopped

volumes:
  adobos_node_modules:
  adobos_backend_modules:
  adobos_frontend_modules:
  adobos_shared_modules:
  adobos_pnpm_store:
  adobos_pgdata:

networks:
  adobos:
    driver: bridge
