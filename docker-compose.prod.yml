# Producción — topología split: gateway / api / worker como servicios
# independientes sobre Redis + BullMQ + Postgres. El binario es el mismo
# (imagen `adobos-backend:latest`); `ADOBO_ROLE` decide qué corre.
#
#   docker compose -f docker-compose.prod.yml build          # construye 1 vez
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --scale backend=3   # N api
#
# IMPORTANTE: solo `gateway` declara `build:` — las otras 3 (`migrate`, `worker`,
# `backend`) referencian la misma imagen `adobos-backend:latest` YA construida.
# Si las 4 declararan `build:` a la vez, Compose (Bake) las construiría en
# paralelo desde el mismo Dockerfile y los stages intermedios se pisan entre sí
# (visto en la práctica: "COPY --from=shared-build ...: not found" / builds
# canceladas a mitad). Si corrés `up --build`, incluí siempre `gateway` en la
# lista de servicios (o mejor, `build` sin filtro) para que la imagen exista
# antes de que arranquen los demás.
#
# `.env` (junto a este fichero) debe traer al menos:
#   POSTGRES_PASSWORD, SESSION_SECRET, PUBLIC_APP_URL, CORS_ORIGIN,
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_TOKEN

x-backend-env: &backend-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  SERVE_STATIC: "false"
  DATABASE_URL: postgresql://adobos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/adobos
  REDIS_URL: redis://redis:6379
  DATA_DIR: /data
  NODE_OPTIONS: --dns-result-order=ipv4first

x-healthcheck: &health
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 25s

services:
  postgres:
    # Fase 8 (PLAN_FINAL_2026.md): imagen fijada por digest, no solo tag.
    # Dependabot (.github/dependabot.yml) abre PR para refrescarla; a mano:
    #   docker pull postgres:16-alpine && docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: adobos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adobos
    volumes:
      - adobos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adobos -d adobos"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [adobos]

  redis:
    # Fase 8: imagen fijada por digest (ver comentario en `postgres` arriba).
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    # Fase 8: AOF (everysec) — BullMQ guarda acá jobs de entrega/reconciliación
    # reales (webhooks, compras, recordatorios); con solo RDB, un crash entre
    # snapshots podía perder hasta 60s de esos jobs. `everysec` es el punto
    # medio estándar (como mucho 1s de pérdida, sin el costo de fsync por
    # escritura de `always`).
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - adobos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [adobos]

  # One-shot: aplica migraciones Drizzle y sale. Los servicios de app esperan
  # a que termine (evita que N réplicas migren a la vez). Sin `build:` — usa
  # la imagen que construye `gateway`.
  migrate:
    image: adobos-backend:latest
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    env_file: [.env]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [adobos]

  # Discord gateway. Un proceso (o N con SHARDS/SHARD_TOTAL disjuntos —
  # ver `createClient.ts`). Único con Client vivo; calienta la caché de Redis.
  # Única build canónica de `adobos-backend:latest` — ver nota arriba.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: adobos-backend:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *backend-env
      ADOBO_ROLE: gateway
      # Multi-proceso: descomentar y desplegar N `gateway` con rangos disjuntos.
      # SHARDS: "0-7"
      # SHARD_TOTAL: "16"
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    networks: [adobos]

  # Worker: consumidores de cola (envíos, borrados, polling). Sin Client — REST.
  # Sin `build:` — usa la imagen que construye `gateway`.
  worker:
    image: adobos-backend:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *backend-env
      ADOBO_ROLE: worker
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    networks: [adobos]

  # Panel + REST. Sin Client — lee de Redis/Postgres; en miss, REST de Discord.
  # Escalable: `--scale backend=N` (nginx round-robin por DNS de Compose).
  # Sin `build:` — usa la imagen que construye `gateway`.
  backend:
    image: adobos-backend:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *backend-env
      ADOBO_ROLE: api
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *health
    stop_grace_period: 20s
    expose:
      - "3000"
    # Para probar el split sin `frontend`, descomentá y `curl localhost:3000/api/health`.
    # ports:
    #   - "3000:3000"
    networks: [adobos]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: adobos-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [adobos]

volumes:
  adobos_pgdata:
  adobos_redisdata:

networks:
  adobos:
    driver: bridge
