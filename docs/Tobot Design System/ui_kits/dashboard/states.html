<!-- @dsCard group="Dashboard" viewport="1360x760" name="Estados — 404, 500, vacío y modo light" subtitle="Dónde aparece TO y dónde no; misma pantalla portada a light" -->
<!doctype html><html data-theme="dark" lang="es"><head><meta charset="utf-8"><title>Tobot — estados</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-base);margin:0;padding:20px;font-family:var(--font-body)}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px}
.frame{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-surface);overflow:hidden}
.light{background:#EFF2E9}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { EmptyState, Button, Alert, Card, Stat, Progress, Badge, Skeleton } = window.TobotDesignSystem_715bd9;
function Frame({title,theme='dark',children,h=300}){
  return <div><div className="lbl">{title}</div>
    <div className="frame" data-theme={theme} style={{height:h,display:'flex',flexDirection:'column',justifyContent:'center',background:'var(--bg-surface)'}}>{children}</div></div>;
}
function App(){
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px',maxWidth:1320,margin:'0 auto'}}>
    <Frame title="404 — página que no existe">
      <EmptyState mood="alert" title="Esta página no existe"
        description="El enlace es viejo o el módulo cambió de nombre. Desde módulos llegas a todo."
        action={<Button>Ir a módulos</Button>} secondaryAction={<Button variant="ghost">Buscar ⌘K</Button>}/>
    </Frame>
    <Frame title="500 — algo se rompió de nuestro lado">
      <EmptyState mood="sleep" title="Tobot se ha caído un momento"
        description="El gateway se reconecta solo. Tus módulos siguen configurados; nada se ha perdido."
        action={<Button variant="secondary">Reintentar</Button>} secondaryAction={<Button variant="ghost">Ver estado</Button>}/>
    </Frame>
    <Frame title="Vacío — módulo sin configurar">
      <EmptyState mood="idle" title="Aún no hay reglas"
        description="Añade un filtro y mira qué caza antes de añadir el segundo."
        action={<Button>Añadir filtro</Button>}/>
    </Frame>
    <Frame title="Error de pago — aquí TO NO aparece">
      <div style={{padding:'24px',display:'grid',gap:14}}>
        <Alert tone="danger" title="No hemos podido cobrar los $6 de septiembre">
          El banco rechazó la Visa ···· 4242. Pro sigue activo 7 días más en tus 3 servidores.
        </Alert>
        <div style={{display:'flex',gap:10}}>
          <Button size="sm">Actualizar método de pago</Button>
          <Button size="sm" variant="ghost">Ver factura</Button>
        </div>
        <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>
          // facturación = solo texto y cifras. Sin mascota, sin ilustración, sin tono simpático.
        </div>
      </div>
    </Frame>
    <Frame title="Modo light — mismo panel, mismos tokens" theme="light" h={320}>
      <div className="light" style={{padding:'20px',height:'100%',display:'grid',gap:14,alignContent:'start'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontFamily:'var(--font-display)',fontWeight:800,letterSpacing:'-.05em',fontSize:22,color:'var(--text-primary)'}}>tobot<span style={{color:'var(--acid-600)'}}>.</span></span>
          <Badge tone="pro">Pro</Badge>
          <span style={{marginLeft:'auto',fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)'}}>data-theme="light"</span>
        </div>
        <div style={{display:'flex',gap:28}}>
          <Stat label="Eventos" value="18.930" unit="/30d"/>
          <Stat label="Filtrados" value="412" delta="+8%"/>
        </div>
        <Progress label="Retención de logs" valueLabel="90 días" value={90}/>
        <div style={{display:'flex',gap:10}}>
          <Button size="sm">Guardar</Button><Button size="sm" variant="secondary">Cancelar</Button><Button size="sm" variant="destructive">Borrar</Button>
        </div>
      </div>
    </Frame>
    <Frame title="Carga — skeletons con la forma del contenido" h={320}>
      <div style={{padding:'20px',display:'grid',gap:12,alignContent:'start'}}>
        {[0,1,2].map(i=>
          <div key={i} style={{display:'flex',gap:12,alignItems:'center',padding:14,border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)'}}>
            <Skeleton width={32} height={32} radius="var(--radius-md)"/>
            <div style={{flex:1,display:'grid',gap:6}}><Skeleton width="40%" height={11}/><Skeleton width="72%" height={9}/></div>
            <Skeleton width={34} height={18} radius="999px"/>
          </div>)}
      </div>
    </Frame>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
