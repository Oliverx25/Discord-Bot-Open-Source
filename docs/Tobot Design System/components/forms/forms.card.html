<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<style>body{background:var(--bg-base);padding:20px;font-family:var(--font-body)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Switch, Checkbox, Radio, ChannelPicker, Slider, TimezoneSelect } = window.TobotDesignSystem_715bd9;
function Demo(){
  const [v,setV]=React.useState('mute');
  const [on,setOn]=React.useState(true);
  const [ch,setCh]=React.useState(['1','2']);
  const [n,setN]=React.useState(3);
  const [tz,setTz]=React.useState('Europe/Madrid');
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
    <div className="col">
      <Input label="Prefijo de comandos" mono prefix="/" defaultValue="tobot" hint="Los slash commands lo ignoran."/>
      <Input label="URL del webhook" defaultValue="https://discord.com/api/…" error="Esa URL no es un webhook de Discord."/>
      <ChannelPicker label="Canales ignorados" kind="channel" value={ch} onChange={setCh}
        options={[{value:'1',label:'mod-chat'},{value:'2',label:'staff',meta:'privado'},{value:'3',label:'bot-tests'},{value:'4',label:'general'}]}/>
      <Slider label="Servidores que administras" min={1} max={12} value={n} onChange={setN} ticks={['1','12']}/>
    </div>
    <div className="col">
      <Select label="Canal de logs" value="mod" options={[{value:'mod',label:'#mod-log'},{value:'audit',label:'#audit-trail'}]}/>
      <TimezoneSelect value={tz} onChange={setTz} preview="Se enviará el 12 sep a las 09:00 (07:00 UTC)"/>
      <div className="col" style={{gap:10}}>
        <Switch checked={on} onChange={e=>setOn(e.target.checked)} label="Auto-mod" hint="Se guarda solo"/>
        <Checkbox checked label="Mensaje borrado" hint="Incluye borrados masivos."/>
        <Checkbox indeterminate label="Cambios de rol"/>
      </div>
      <Radio label="Al infringir" name="p" value={v} onChange={setV} direction="row"
        options={[{value:'warn',label:'Avisar'},{value:'mute',label:'Timeout'},{value:'ban',label:'Banear'}]}/>
    </div>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
