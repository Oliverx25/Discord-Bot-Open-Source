      <ModuleCard layout="row" index={2} name="Welcome cards" description="Joins, salidas, bans y boosts en canvas." enabled

        icon={<I n="coins" s={17}/>} stat="Apagado" onToggle={<Switch size="sm" checked={false}/>}/>
    </div>
