<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<title>Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<style>body{background:var(--bg-base);padding:20px;font-family:var(--font-body)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Alert, EmptyState, Skeleton, Toast, Tooltip, Dialog, Button, IconButton } = window.TobotDesignSystem_715bd9;
function I({n,s=16}){const r=React.useRef(null);React.useEffect(()=>{if(!r.current||!window.lucide)return;r.current.innerHTML='';const k=n.split('-').map(p=>p[0].toUpperCase()+p.slice(1)).join('');const dfn=lucide[k];if(!dfn)return;const el=lucide.createElement(dfn);el.setAttribute('width',s);el.setAttribute('height',s);el.setAttribute('stroke-width',2);r.current.appendChild(el)},[n,s]);return <span ref={r} style={{display:'flex'}}/>}
function Demo(){return <div className="col" style={{gap:18}}>
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
    <Alert tone="warning" icon={<I n="shield-alert"/>} title="Falta el permiso Manage Roles"
      action={<Button size="sm" variant="secondary">Revisar permisos</Button>}>Los autoroles no se aplicarán hasta que Tobot pueda gestionar roles.</Alert>
    <Alert tone="danger" icon={<I n="alert-triangle"/>} title="Webhook rechazado (401)" onDismiss={()=>{}}>Vuelve a enlazar el canal y reintentamos los eventos en cola.</Alert>
    <Alert tone="success" icon={<I n="check"/>} title="Configuración copiada a 2 servidores"/>
    <Alert tone="info" icon={<I n="info"/>} title="Este módulo es Pro">Tu plan ya lo incluye en todos tus servidores.</Alert>
  </div>
  <div style={{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:14,alignItems:'start'}}>
    <div style={{border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)',background:'var(--bg-surface)'}}>
      <EmptyState compact mood="ok" celebrate title="Primer comando ejecutado"
        description="/tobot economy ya está corriendo en Adobos." action={<Button size="sm">Ver economía</Button>}/>
    </div>
    <div className="col">
      <Toast tone="success" icon={<I n="check"/>} title="Auto-mod activado" description="Aplicado a Adobos al instante." onDismiss={()=>{}}/>
      <div style={{padding:14,border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)',background:'var(--bg-surface)',display:'grid',gap:10}}>
        <div className="lbl">cargando</div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}><Skeleton circle width={28}/><Skeleton lines={2} style={{flex:1}}/></div>
        <Skeleton lines={3}/>
      </div>
      <div className="row">
        <Tooltip label="Requiere Manage Roles"><IconButton icon={<I n="shield"/>} label="Permisos" variant="outline"/></Tooltip>
        <Tooltip label="Copiar ID del servidor" side="right" mono><IconButton icon={<I n="copy"/>} label="Copiar" variant="outline"/></Tooltip>
      </div>
    </div>
  </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
