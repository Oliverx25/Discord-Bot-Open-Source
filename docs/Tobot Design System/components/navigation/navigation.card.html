<!doctype html><html data-theme="dark"><head><meta charset="utf-8">
<title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<style>body{background:var(--bg-base);padding:20px;font-family:var(--font-body)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Tabs, NavItem, Menu, Accordion, Stepper, CommandPalette, Badge, IconButton, Button } = window.TobotDesignSystem_715bd9;
function I({n,s=16}){const r=React.useRef(null);React.useEffect(()=>{if(!r.current||!window.lucide)return;r.current.innerHTML='';const k=n.split('-').map(p=>p[0].toUpperCase()+p.slice(1)).join('');const dfn=lucide[k];if(!dfn)return;const el=lucide.createElement(dfn);el.setAttribute('width',s);el.setAttribute('height',s);el.setAttribute('stroke-width',2);r.current.appendChild(el)},[n,s]);return <span ref={r} style={{display:'flex'}}/>}
function Demo(){
  const [a,setA]=React.useState('settings');const [b,setB]=React.useState('7d');const [pal,setPal]=React.useState(false);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 250px',gap:22,alignItems:'start'}}>
    <div className="col" style={{gap:18}}>
      <Tabs value={a} onChange={setA} tabs={[{value:'settings',label:'Ajustes'},{value:'logs',label:'Logs',count:24},{value:'perms',label:'Permisos'}]}/>
      <div className="row">
        <Tabs variant="segmented" value={b} onChange={setB} tabs={[{value:'24h',label:'24h'},{value:'7d',label:'7d'},{value:'30d',label:'30d'}]} style={{width:'fit-content'}}/>
        <Menu align="left" trigger={<Button size="sm" variant="secondary">Acciones ▾</Button>}
          items={[{label:'Duplicar módulo',icon:<I n="copy" s={14}/>,shortcut:'⌘D'},{label:'Copiar a otro servidor',icon:<I n="arrow-right" s={14}/>},{separator:true},{label:'Restablecer',icon:<I n="trash-2" s={14}/>,tone:'danger'}]}/>
        <Button size="sm" variant="ghost" onClick={()=>setPal(true)}>Abrir ⌘K</Button>
      </div>
      <Stepper current={1} steps={['Invitar el bot','Elegir módulos','Configurar logs']}/>
      <Accordion items={[
        {title:'¿La capa gratis es una prueba?',content:'No. Quince módulos son gratis sin límite de tiempo y sin cobro por servidor.'},
        {title:'¿Qué pasa si dejo de pagar?',content:'Los módulos Pro se apagan y tu configuración se queda.'}]}/>
    </div>
    <div style={{background:'var(--bg-surface)',border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-lg)',padding:'10px'}}>
      <div className="lbl" style={{padding:'4px 10px 8px'}}>Servidor</div>
      <div className="col" style={{gap:2}}>
        <NavItem icon={<I n="layout-grid"/>} label="Módulos"/>
        <NavItem icon={<I n="shield-alert"/>} label="Auto-mod" active badge={<Badge tone="pro" size="sm">Pro</Badge>}/>
        <NavItem icon={<I n="scroll-text"/>} label="Action logs"/>
        <NavItem icon={<I n="coins"/>} label="Economía"/>
      </div>
    </div>
    <CommandPalette open={pal} onClose={()=>setPal(false)}
      commands={[{label:'Activar auto-mod',group:'Adobos',icon:<I n="shield-alert" s={14}/>},
        {label:'Ir a Action logs',group:'Adobos',icon:<I n="scroll-text" s={14}/>,shortcut:'G L'},
        {label:'Cambiar a Rocket Lobby',group:'Servidores',icon:<I n="arrow-right" s={14}/>},
        {label:'Copiar configuración a…',group:'Acciones',icon:<I n="copy" s={14}/>}]}/>
  </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
