<!-- @dsCard group="Motion" viewport="700x300" name="Botón físico — los tres estados" subtitle="Default 4px · hover 2px · press 0. La fila de abajo es real: pasa el cursor y pulsa." -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px;background:var(--bg-base)}
.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.b{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;border-radius:var(--radius-md);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:transform 90ms cubic-bezier(.2,.9,.1,1),box-shadow 90ms cubic-bezier(.2,.9,.1,1),background 140ms}
.s-default{box-shadow:4px 4px 0 var(--accent-shadow)}
.s-hover{box-shadow:2px 2px 0 var(--accent-shadow);transform:translate(2px,2px);background:var(--accent-hover);border-color:var(--accent-hover)}
.s-press{box-shadow:0 0 0 var(--accent-shadow);transform:translate(4px,4px);background:var(--accent-active);border-color:var(--accent-active)}
.live{box-shadow:4px 4px 0 var(--accent-shadow)}
.live:hover{box-shadow:2px 2px 0 var(--accent-shadow);transform:translate(2px,2px);background:var(--accent-hover)}
.live:active{box-shadow:0 0 0 var(--accent-shadow);transform:translate(4px,4px);background:var(--accent-active)}
.b.sec{background:transparent;color:var(--text-primary);border-color:var(--border-strong);box-shadow:4px 4px 0 var(--border-subtle)}
.b.sec:hover{color:var(--text-accent);border-color:var(--accent);box-shadow:2px 2px 0 var(--border-subtle);transform:translate(2px,2px)}
.b.sec:active{box-shadow:0 0 0 var(--border-subtle);transform:translate(4px,4px)}
.b.dan{background:transparent;color:var(--danger);border-color:var(--danger-border);box-shadow:4px 4px 0 var(--danger-shadow)}
.b.dan:hover{background:var(--danger-bg);box-shadow:2px 2px 0 var(--danger-shadow);transform:translate(2px,2px)}
.b.dan:active{box-shadow:0 0 0 var(--danger-shadow);transform:translate(4px,4px)}
.b.gh{background:transparent;color:var(--text-secondary);border-color:transparent;box-shadow:none}
.b.gh:hover{background:var(--bg-hover);color:var(--text-primary)}
.b.gh:active{transform:scale(.985)}
.cell{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
</style></head><body>
<div style="display:flex;gap:44px;align-items:flex-start;padding:6px 0 22px;border-bottom:1px solid var(--border-subtle)">
<div class="cell"><span class="b s-default">Activar</span><span class="lb">default · sombra 4px</span></div>
<div class="cell"><span class="b s-hover">Activar</span><span class="lb">hover · baja 2px, sombra 2px</span></div>
<div class="cell"><span class="b s-press">Activar</span><span class="lb">press · baja 4px, sin sombra</span></div>
<div class="lb" style="max-width:210px;line-height:1.6;margin-left:auto">90&nbsp;ms · <b style="color:var(--text-secondary)">--ease-snap</b><br>El botón toca fondo: la sombra no se difumina, se consume. Nunca lo sustituyas por escala, glow o ripple.</div>
</div>
<div style="display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap">
<button class="b live">Primario</button>
<button class="b sec">Secundario</button>
<button class="b dan">Destructivo</button>
<button class="b gh">Ghost</button>
<span class="lb" style="margin-left:auto">fila real — pasa el cursor y mantén pulsado</span>
</div>
</body></html>
