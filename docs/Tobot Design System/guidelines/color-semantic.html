<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>Estados</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-base)}.g{display:grid;gap:10px}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;font-weight:600;color:var(--text-primary)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div style="padding:12px;border-radius:var(--radius-md);background:var(--success-bg);border:1px solid var(--success-border)"><div style="font-weight:700;color:var(--success);font-size:13px">Success</div><div class="lb">#6FE3B0</div><div class="lb">--success</div></div>
<div style="padding:12px;border-radius:var(--radius-md);background:var(--warning-bg);border:1px solid var(--warning-border)"><div style="font-weight:700;color:var(--warning);font-size:13px">Warning</div><div class="lb">#FFCB63</div><div class="lb">--warning</div></div>
<div style="padding:12px;border-radius:var(--radius-md);background:var(--danger-bg);border:1px solid var(--danger-border)"><div style="font-weight:700;color:var(--danger);font-size:13px">Error</div><div class="lb">#FF8B7F</div><div class="lb">--danger</div></div>
<div style="padding:12px;border-radius:var(--radius-md);background:var(--info-bg);border:1px solid var(--info-border)"><div style="font-weight:700;color:var(--info);font-size:13px">Info</div><div class="lb">#C6D2BC</div><div class="lb">--info</div></div>
</div></body></html>
