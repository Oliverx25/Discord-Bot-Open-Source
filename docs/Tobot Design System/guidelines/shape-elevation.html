<!-- @dsCard group="Shape" viewport="700x220" name="Elevación: sombra dura vs difusa" subtitle="Offset sólido para lo pulsable; blur solo para lo que flota" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>Elevación</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-base)}.g{display:grid;gap:10px}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;font-weight:600;color:var(--text-primary)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
<div>
<div class="lb" style="margin-bottom:10px">SOMBRA DURA · 0 blur · firma de marca</div>
<div style="display:flex;gap:14px;align-items:flex-start">
<div style="padding:10px 16px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius-md);box-shadow:var(--shadow-hard);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em">DEFAULT</div>
<div style="padding:10px 16px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius-md);box-shadow:2px 2px 0 var(--accent-shadow);transform:translate(2px,2px);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em">HOVER</div>
<div style="padding:10px 16px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius-md);transform:translate(4px,4px);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em">PRESS</div>
</div>
<div class="lb" style="margin-top:12px">--shadow-hard 4px 4px 0 · --accent-shadow #5E7F19<br>hover 2px · press 0 · 90ms ease-snap</div>
</div>
<div>
<div class="lb" style="margin-bottom:10px">DIFUSA · solo lo que flota</div>
<div style="display:flex;gap:10px">
<div style="flex:1;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-1)"><div class="nm">1</div><div class="lb">sticky</div></div>
<div style="flex:1;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-2)"><div class="nm">2</div><div class="lb">toast, menú</div></div>
<div style="flex:1;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:12px;box-shadow:var(--shadow-3)"><div class="nm">3</div><div class="lb">modal</div></div>
</div>
<div class="lb" style="margin-top:12px">Las cards en rejilla no llevan sombra: se separan con gaps de 1px sobre el color de borde.</div>
</div>
</div></body></html>
