<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-base)}.lb{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}.nm{font-size:12px;font-weight:600;color:var(--text-primary)}</style></head><body>
<div style="display:flex;border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden">
<div style="flex:1;background:var(--bg-inset);padding:16px"><div class="nm">inset</div><div class="lb">#E6EBDD</div></div>
<div style="flex:1;background:var(--bg-base);padding:16px;border-left:1px solid var(--border-subtle)"><div class="nm">base</div><div class="lb">#EFF2E9</div></div>
<div style="flex:1;background:var(--bg-surface);padding:16px;border-left:1px solid var(--border-subtle)"><div class="nm">surface</div><div class="lb">#F8FBF3</div></div>
<div style="flex:1;background:var(--accent);padding:16px"><div class="nm" style="color:var(--on-accent)">accent</div><div class="lb" style="color:var(--on-accent)">#C6FF3D</div></div>
</div><div class="lb" style="margin-top:10px">Light es un puerto. Las decisiones se toman en dark.</div></body></html>
